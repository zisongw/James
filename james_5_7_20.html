      var CUV_CHAPTER_CACHE = {};

      function cleanZhText(t) {
        return String(t || '')
          .replace(/\s+/g, ' ')
          .replace(/([\u3000-\u303f\u4e00-\u9fff\uff00-\uffef“”‘’])\s+(?=[\u3000-\u303f\u4e00-\u9fff\uff00-\uffef“”‘’])/g, '$1')
          .trim();
      }

      function parseRef(raw) {
        var clean = String(raw || '').replace(/–/g, '-').trim();
        var m = clean.match(/^([1-3]?[A-Za-z]+)\s+(\d+)(?::(\d+)(?:-(\d+):(\d+)|-(\d+))?)?$/);
        if (!m || !BOOKS[m[1]]) {
          return { key: clean, book: 'Jas', sc: 5, sv: 7, ec: 5, ev: 20, wholeChap: false };
        }
        var book = m[1];
        var sc = parseInt(m[2], 10);
        var wholeChap = !m[3];
        var sv = m[3] ? parseInt(m[3], 10) : 1;
        var ec = m[4] ? parseInt(m[4], 10) : sc;
        var ev = m[5] ? parseInt(m[5], 10) : (m[6] ? parseInt(m[6], 10) : (wholeChap ? 999 : sv));
        return { key: clean, book: book, sc: sc, sv: sv, ec: ec, ev: ev, wholeChap: wholeChap };
      }

      function buildScriptureHTML(raw) {
        var p = parseRef(raw);
        var B = BOOKS[p.book];
        var isSingleChapBook = p.book === 'Jud';
        var rangeStr = p.wholeChap
          ? String(p.sc)
          : (p.ec !== p.sc
              ? (p.sc + ':' + p.sv + '-' + p.ec + ':' + p.ev)
              : (p.ev !== p.sv ? (p.sc + ':' + p.sv + '-' + p.ev) : (p.sc + ':' + p.sv)));

        if (appState.lang === 'zh') {
          var labelZh = isSingleChapBook
            ? (B.zh + ' ' + (p.ev !== p.sv ? (p.sv + '–' + p.ev) : String(p.sv)))
            : (B.zh + ' ' + rangeStr.replace(/-/g, '–'));
          var wdUrl = 'https://wd.bible/bible/verse/' + B.wd + '.' + p.sc + '.' + p.sv + '.cunps';
          return (
            '<a class="sc-zh" href="' + wdUrl + '" target="_blank" rel="noopener noreferrer" ' +
            'data-refkey="' + p.key + '" data-gb="' + B.gb + '" data-sc="' + p.sc + '" data-sv="' + p.sv + '" ' +
            'data-ec="' + p.ec + '" data-ev="' + p.ev + '" data-full="' + labelZh + '">' +
            labelZh + '</a>'
          );
        }

        var labelEn = B.enShort + ' ' + rangeStr;
        var fullEn = B.enFull + ' ' + rangeStr;
        var refLyUrl = 'https://ref.ly/' + encodeURIComponent(fullEn) + ';lsb';
        return (
          '<span class="sc-en"><a href="' + refLyUrl + '" target="_blank" rel="noopener noreferrer" data-ref="' + fullEn + '">' +
          labelEn + '</a></span>'
        );
      }

      function renderRichText(str) {
        return String(str || '').replace(/\[\[(.+?)\]\]/g, function (_, ref) {
          return buildScriptureHTML(ref);
        });
      }

      function fetchChapterCuv(bookNum, chapNum) {
        var cacheKey = bookNum + '/' + chapNum;
        if (!CUV_CHAPTER_CACHE[cacheKey]) {
          CUV_CHAPTER_CACHE[cacheKey] = fetch('https://api.getbible.net/v2/cus/' + bookNum + '/' + chapNum + '.json')
            .then(function (r) {
              if (!r.ok) throw new Error('HTTP ' + r.status);
              return r.json();
            })
            .then(function (json) {
              return (json.verses || []).map(function (v) {
                return { c: Number(v.chapter || chapNum), v: Number(v.verse), t: cleanZhText(v.text) };
              });
            })
            .catch(function (err) {
              delete CUV_CHAPTER_CACHE[cacheKey];
              throw err;
            });
        }
        return CUV_CHAPTER_CACHE[cacheKey];
      }

      function getCuvTooltipText(dataset) {
        var key = dataset.refkey;
        var gb = Number(dataset.gb);
        var sc = Number(dataset.sc);
        var sv = Number(dataset.sv);
        var ec = Number(dataset.ec);
        var ev = Number(dataset.ev);
        var maxVerses = 5;

        var estCount = (ec === sc) ? (ev - sv + 1) : 10;
        if (estCount > maxVerses && CUV_FALLBACK[key]) {
          return Promise.resolve(CUV_FALLBACK[key]);
        }

        var chapters = [];
        for (var c = sc; c <= ec; c++) chapters.push(c);

        return Promise.all(chapters.map(function (ch) { return fetchChapterCuv(gb, ch); }))
          .then(function (lists) {
            var collected = [];
            var truncated = false;
            lists.forEach(function (vs, idx) {
              var ch = chapters[idx];
              vs.forEach(function (item) {
                var from = (ch === sc) ? sv : 1;
                var to = (ch === ec) ? ev : 999;
                if (item.v >= from && item.v <= to) {
                  if (collected.length < maxVerses) {
                    collected.push(item.t);
                  } else {
                    truncated = true;
                  }
                }
              });
            });
            if (!collected.length) {
              return CUV_FALLBACK[key] || '点击打开微读圣经查阅完整经文。';
            }
            return collected.join('') + (truncated ? '……' : '');
          })
          .catch(function () {
            return CUV_FALLBACK[key] || '点击打开微读圣经查阅完整经文。';
          });
      }

      var isTouchDevice = window.matchMedia && window.matchMedia('(hover: none)').matches;
      var tipTarget = null;
      var hideTipTimer = null;

      function positionTip(anchor) {
        var rect = anchor.getBoundingClientRect();
        var width = Math.min(360, window.innerWidth - 16);
        tipEl.style.width = width + 'px';
        var left = Math.min(Math.max(8, rect.left + rect.width / 2 - width / 2), window.innerWidth - width - 8);
        tipEl.style.left = left + 'px';
        var height = tipEl.offsetHeight || 120;
        var below = rect.bottom + 8;
        var above = rect.top - height - 8;
        tipEl.style.top = (below + height < window.innerHeight - 8 || above < 8 ? below : above) + 'px';
      }

      function showZhTip(anchor) {
        clearTimeout(hideTipTimer);
        tipTarget = anchor;
        var d = anchor.dataset;
        var immediateText = CUV_FALLBACK[d.refkey];
        tipEl.innerHTML =
          '<div class="zt-head"><span>' + d.full + '</span><span class="zt-ver">和合本</span></div>' +
          '<div class="zt-body">' + (immediateText ? immediateText : '<span class="zt-muted">经文载入中……</span>') + '</div>';
        tipEl.classList.add('visible');
        positionTip(anchor);

        getCuvTooltipText(d).then(function (text) {
          if (tipTarget !== anchor) return;
          var bodyEl = tipEl.querySelector('.zt-body');
          if (bodyEl) {
            bodyEl.textContent = text;
            positionTip(anchor);
          }
        });
      }

      function hideZhTip() {
        tipEl.classList.remove('visible');
        tipTarget = null;

      // 6. PERSISTENCE & ACCESS LOCK

      function loadSavedLanguage() {
        try {
          var saved = window.localStorage.getItem(STORAGE_KEY_LANG);
          if (saved === 'zh' || saved === 'en') appState.lang = saved;
        } catch (err) {}
      }

      function saveLanguage(lang) {
        try {
          window.localStorage.setItem(STORAGE_KEY_LANG, lang);
        } catch (err) {}
      }

      function loadUnlockState() {
        try {
          appState.isUnlocked = window.sessionStorage.getItem(STORAGE_KEY_AUTH) === '1';
        } catch (err) {
          appState.isUnlocked = false;
        }
      }

      function saveUnlockState() {
        try {
          window.sessionStorage.setItem(STORAGE_KEY_AUTH, '1');
        } catch (err) {}
      }

      function applyAccessLockState() {
        var gateEl = document.getElementById('accessGate');
        var contentEl = document.getElementById('protectedContent');
        var footerEl = document.getElementById('protectedFooter');

        if (gateEl) gateEl.classList.toggle('hidden', appState.isUnlocked);
        if (contentEl) contentEl.classList.toggle('hidden', !appState.isUnlocked);
        if (footerEl) footerEl.classList.toggle('hidden', !appState.isUnlocked);
      }

      function renderHeroPassageBox() {
        var lang = appState.lang;
        var tabsEl = document.getElementById('heroVerseTabs');
        var greekEl = document.getElementById('heroGreekLine');
        var transEl = document.getElementById('heroTransLine');
        var legendEl = document.getElementById('heroLegendRow');
        if (!tabsEl || !greekEl || !transEl || !legendEl) return;

        tabsEl.innerHTML = HERO_PASSAGES.map(function (p) {
          var active = appState.activeHeroPassage === p.id;
          var cls = active
            ? 'bg-gold text-white border-gold'
            : 'bg-white/10 text-slate-200 border-white/20 hover:bg-white/20';
          return (
            '<button type="button" role="tab" aria-selected="' + active + '" data-hero-p="' + p.id + '" ' +
            'class="hero-p-tab px-3 py-1 rounded-lg border text-xs font-semibold transition-colors ' + cls + '">' +
              p.tab[lang] +
            '</button>'
          );
        }).join('');

        tabsEl.querySelectorAll('.hero-p-tab').forEach(function (btn) {
          btn.addEventListener('click', function () {
            appState.activeHeroPassage = btn.getAttribute('data-hero-p');
            renderHeroPassageBox();
          });
        });

        var current = HERO_PASSAGES[0];
        for (var i = 0; i < HERO_PASSAGES.length; i++) {
          if (HERO_PASSAGES[i].id === appState.activeHeroPassage) {
            current = HERO_PASSAGES[i];
            break;
          }
        }

        greekEl.innerHTML = current.greek;
        transEl.innerHTML = current.trans[lang];
        legendEl.innerHTML = current.legend.map(function (item) {
          return (
            '<a href="#' + item.id + '" class="kw-token ' + item.cls + ' text-xs">' +
              item.greek + ' (' + item.strongs + ') ↔ ' + item[lang] +
            '</a>'
          );
        }).join('');
      }

      function renderChrome() {
        var lang = appState.lang;
        var dict = UI_TEXT[lang];
        var isZh = lang === 'zh';

        document.documentElement.lang = isZh ? 'zh-CN' : 'en';
        document.title = dict.pageTitle;

        var brandEmblem = document.getElementById('brandEmblem');
        var footerEmblem = document.getElementById('footerEmblem');
        if (brandEmblem) brandEmblem.textContent = dict.emblem;
        if (footerEmblem) footerEmblem.textContent = dict.emblem;

        var pillZh = document.getElementById('lang-pill-zh');
        var pillEn = document.getElementById('lang-pill-en');
        var toggleBtn = document.getElementById('btn-lang-toggle');
        if (pillZh && pillEn) {
          pillZh.className = isZh
            ? 'px-2 py-1 rounded-md bg-navy text-parchment transition-colors'
            : 'px-2 py-1 rounded-md text-[#3b3228] transition-colors';

            ? 'px-2 py-1 rounded-md bg-navy text-parchment transition-colors'
            : 'px-2 py-1 rounded-md text-[#3b3228] transition-colors';
        }
        if (toggleBtn) toggleBtn.title = dict.langBtnTitle;

        document.querySelectorAll('[data-i18n]').forEach(function (el) {
          var key = el.getAttribute('data-i18n');
          if (dict[key] !== undefined) el.textContent = dict[key];
        });

        var pwdInput = document.getElementById('accessPasswordInput');
        if (pwdInput) pwdInput.setAttribute('placeholder', dict.gatePlaceholder);

        var togglePwdBtn = document.getElementById('togglePasswordVisibility');
        if (togglePwdBtn && pwdInput) {
          togglePwdBtn.setAttribute('aria-label', pwdInput.type === 'password' ? dict.gateShowPwd : dict.gateHidePwd);

        renderHeroPassageBox();
      }

            '<div class="p-5 space-y-3 text-xs sm:text-sm text-inkMuted leading-relaxed">' +
              '<p>' + renderRichText(isZh
                ? '<strong>全书最后一记警钟与爱心的呼召（[[Jas 5:19-20]]）：</strong>若有弟兄像偏离轨道的行星一样“失迷真道（πλανάω）”，教会绝不可袖手旁观或背后论断，而当主动以温柔和真理使他回转（[[Gal 6:1-2]]；[[Jud 1:22-23]]）。'
                : '<strong>The Epistle’s Final Call of Watchful Love ([[Jas 5:19-20]]):</strong> When a believer drifts off the orbit of truth (πλανάω), the church must neither stay indifferent nor slander from afar, but actively turn him back in meekness and truth ([[Gal 6:1-2]]; [[Jud 1:22-23]]).'
              ) + '</p>' +
              '<div class="p-4 rounded-xl bg-parchmentDeep/70 border-l-4 border-gold text-ink">' +
                renderRichText(isZh
                  ? '<strong>“救一个灵魂不死，并且遮盖许多的罪”（对照 [[1Pe 4:8-10]]）：</strong>这正是真正相交（圣餐）与彼此切实相爱的极致体现——一个依靠从上头来的清洁智慧而运行的合一教会。'
                  : '<strong>“Save a Soul from Death and Cover a Multitude of Sins” (cf. [[1Pe 4:8-10]]):</strong> This is the ultimate expression of genuine communion and fervent love—a united church operating in the pure wisdom from above.'
                ) +
              '</div>' +
            '</div>';
        }
      }

      function renderClosure() {
        var isZh = appState.lang === 'zh';
        var grid = document.getElementById('closureGrid');
        if (!grid) return;

        var mirrors = isZh
          ? [
              { a: '试炼中的喜乐与忍耐（[[Jas 1:2-6]]）', a2: '忍耐等候主来、效法先知与约伯（[[Jas 5:7-11]]）' },
              { a: '凭信心求智慧、不心怀二意（[[Jas 1:2-6]]）', a2: '不可起誓、凭信心祷告与彼此代求（[[Jas 5:12-18]]）' },
              { a: '不要看错（πλανάω，[[Jas 1:16]]）与清洁虔诚（[[Jas 1:26-27]]）', a2: '挽回失迷真道者（πλανάω，[[Jas 5:19-20]]）与肢体守望' }
            ]
          : [
              { a: 'Joy & endurance under trials ([[Jas 1:2-6]])', a2: 'Patient waiting for the Lord, following prophets & Job ([[Jas 5:7-11]])' },
              { a: 'Asking in unwavering faith ([[Jas 1:2-6]])', a2: 'Honest speech, fervent prayer & mutual intercession ([[Jas 5:12-18]])' },
              { a: 'Do not be deceived (πλανάω, [[Jas 1:16]]) & pure religion ([[Jas 1:26-27]])', a2: 'Restoring the straying (πλανάω, [[Jas 5:19-20]]) & watchful love' }
            ];

        grid.innerHTML =
          '<article class="lg:col-span-7 bg-white rounded-2xl border border-parchmentBorder shadow-card overflow-hidden">' +
            '<div class="px-5 py-4 bg-parchmentDeep/75 border-b border-parchmentBorder">' +
              '<h3 class="font-serif text-xl font-bold text-navy">' + (isZh ? '首尾对称收束：单元 A（1:2–27）↔ 单元 A\'（5:7–20）' : 'Outer Symmetry Complete: Unit A (1:2–27) ↔ Unit A\' (5:7–20)') + '</h3>' +
            '</div>' +
            '<div class="p-5 space-y-3">' +
              mirrors.map(function (m, idx) {
                return (
                  '<div class="p-3.5 rounded-xl bg-parchment/80 border border-parchmentBorder grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs sm:text-sm">' +
                    '<div class="flex items-start gap-2 text-navy font-semibold">' +
                      '<span class="px-1.5 py-0.5 rounded bg-navy text-white text-[10px] font-bold shrink-0 mt-0.5">A.' + (idx + 1) + '</span>' +
                      '<span>' + renderRichText(m.a) + '</span>' +
                    '</div>' +
                    '<div class="flex items-start gap-2 text-inkMuted">' +
                      '<span class="px-1.5 py-0.5 rounded bg-gold text-white text-[10px] font-bold shrink-0 mt-0.5">A\'.' + (idx + 1) + '</span>' +
                      '<span>' + renderRichText(m.a2) + '</span>' +
                    '</div>' +
                  '</div>'
                );
              }).join('') +
            '</div>' +
          '</article>' +
          '<article class="lg:col-span-5 bg-white rounded-2xl border border-parchmentBorder shadow-card overflow-hidden">' +
            '<div class="px-5 py-4 bg-parchmentDeep/75 border-b border-parchmentBorder">' +
              '<h3 class="font-serif text-xl font-bold text-navy">' + (isZh ? '延伸展望：圣灵里的属灵恩赐与教会建造' : 'Looking Ahead: Spiritual Gifts & Building Up the Church') + '</h3>' +
            '</div>' +
            '<div class="p-5 space-y-3 text-xs sm:text-sm text-inkMuted leading-relaxed">' +
              '<p>' + renderRichText(isZh
                ? '雅各书以一个彼此认罪、互相代求、彼此挽回的合一教会作结。圣灵将各样恩赐赐给信徒——包括动机恩赐（[[Rom 12:3-7]]；[[1Pe 4:8-10]]）与显现恩赐（[[1Co 12:4-11]]）——全都是为了整个教会的益处与各种服事善工，直等到我们在基督里同归于一（[[Eph 4:11-13]]）。'
                : 'James closes with a healed, interceding, mutually restoring church. The Holy Spirit distributes diverse gifts—motivational gifts ([[Rom 12:3-7]]; [[1Pe 4:8-10]]) and manifestation gifts ([[1Co 12:4-11]])—solely for the common good and building up the body of Christ into unity ([[Eph 4:11-13]]).'
              ) + '</p>' +
              '<div class="p-4 rounded-xl bg-navy text-white font-serif text-sm sm:text-base font-bold text-center">' +
                (isZh ? '用清洁属神的智慧在基督里生活，在教会里服事' : 'Live in Christ and serve in the church with pure, godly wisdom') +
              '</div>' +
            '</div>' +
          '</article>';
      }

      function renderFooterSitemap() {
        var lang = appState.lang;
        var dict = UI_TEXT[lang];
        var container = document.getElementById('footerSitemap');
        if (!container) return;

        var homeItem =
          '<a href="index.html" class="flex items-center gap-2 px-3 py-2 rounded-lg bg-white/5 hover:bg-white/10 border border-white/10 text-slate-300 hover:text-white transition-colors">' +
            '<span class="px-1.5 py-0.5 rounded bg-white/10 text-goldLight text-[10px] font-bold shrink-0">' + dict.sitemapHomeTag + '</span>' +
            '<span class="truncate">' + dict.sitemapHomeLabel + '</span>' +
          '</a>';

        var unitItems = SITEMAP_UNITS.map(function (u) {
          var cls = u.current
            ? 'bg-white/10 border-gold/40 text-white font-semibold'
            : 'bg-white/5 hover:bg-white/10 border-white/10 text-slate-300 hover:text-white';
          var badgeCls = u.current ? 'bg-gold text-white' : 'bg-white/10 text-goldLight';
          return (
            '<a href="' + u.href + '" class="flex items-center gap-2 px-3 py-2 rounded-lg border transition-colors ' + cls + '">' +
              '<span class="px-1.5 py-0.5 rounded text-[10px] font-bold shrink-0 ' + badgeCls + '">' + u.marker[lang] + '</span>' +
              '<span class="truncate">' + u.ref[lang] + ' · ' + u.title[lang] + '</span>' +
            '</a>'
          );
        }).join('');

        container.innerHTML = homeItem + unitItems;
      }

      function renderAll() {
        hideZhTip();
        renderChrome();
        renderLexicon();
        renderWeek17();
        renderWeek18();
        renderClosure();
        renderFooterSitemap();
        refreshReftagger();
      }

      // -------------------------------------------------------------------
      // 8. EVENT HANDLERS
      // -------------------------------------------------------------------
      function initEvents() {
        var langBtn = document.getElementById('btn-lang-toggle');
        if (langBtn) {
          langBtn.addEventListener('click', function () {
            appState.lang = appState.lang === 'zh' ? 'en' : 'zh';
            saveLanguage(appState.lang);
            renderAll();
          });
        }

        var mobileBtn = document.getElementById('mobileMenuBtn');
        var mobileMenu = document.getElementById('mobileMenu');
        if (mobileBtn && mobileMenu) {
          mobileBtn.addEventListener('click', function () {
            var isOpen = !mobileMenu.classList.contains('hidden');
            mobileMenu.classList.toggle('hidden', isOpen);
            mobileBtn.setAttribute('aria-expanded', String(!isOpen));
          });
          mobileMenu.querySelectorAll('.mobile-nav-link').forEach(function (link) {
            link.addEventListener('click', function () {
              mobileMenu.classList.add('hidden');
              mobileBtn.setAttribute('aria-expanded', 'false');
            });
          });
        }

        var gateForm = document.getElementById('accessGateForm');
        var pwdInput = document.getElementById('accessPasswordInput');
        var errMsg = document.getElementById('accessErrorMsg');
        var togglePwdBtn = document.getElementById('togglePasswordVisibility');
        var eyeShow = document.getElementById('eyeIconShow');
        var eyeHide = document.getElementById('eyeIconHide');

        if (togglePwdBtn && pwdInput) {
          togglePwdBtn.addEventListener('click', function () {
            var isHidden = pwdInput.type === 'password';
            pwdInput.type = isHidden ? 'text' : 'password';
            if (eyeShow && eyeHide) {
              eyeShow.classList.toggle('hidden', isHidden);
              eyeHide.classList.toggle('hidden', !isHidden);
            }
            var dict = UI_TEXT[appState.lang];
            togglePwdBtn.setAttribute('aria-label', isHidden ? dict.gateHidePwd : dict.gateShowPwd);
          });
        }

        if (pwdInput && errMsg) {
          pwdInput.addEventListener('input', function () {
            errMsg.classList.add('hidden');
            pwdInput.classList.remove('border-red-500', 'ring-1', 'ring-red-500');
          });
        }

        if (gateForm && pwdInput) {
          gateForm.addEventListener('submit', function (e) {
            e.preventDefault();
            var entered = String(pwdInput.value || '').trim();
            if (entered === ACCESS_PASSWORD) {
              appState.isUnlocked = true;
              saveUnlockState();
              if (errMsg) errMsg.classList.add('hidden');
              pwdInput.value = '';
              applyAccessLockState();
              refreshReftagger();
            } else {
              if (errMsg) errMsg.classList.remove('hidden');
              pwdInput.classList.add('border-red-500', 'ring-1', 'ring-red-500');
              pwdInput.focus();
              pwdInput.select();
            }
          });
        }

        // Redirect in-page anchors to password gate while locked
        document.addEventListener('click', function (e) {
          var anchor = e.target.closest && e.target.closest('a[href^="#lex"], a[href="#week17"], a[href="#week18"], a[href="#closure"]');
          if (anchor && !appState.isUnlocked) {
            e.preventDefault();
            var gateEl = document.getElementById('accessGate');
            if (gateEl) gateEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
            if (pwdInput) window.setTimeout(function () { pwdInput.focus(); }, 250);
          }
        });

        // Delegated CUV hover/tap tooltip
        if (!isTouchDevice) {
          document.addEventListener('mouseover', function (e) {
            var a = e.target.closest && e.target.closest('a.sc-zh');
            if (a && a !== tipTarget) {
              showZhTip(a);
            } else if (a || (e.target.closest && e.target.closest('#zh-tip'))) {
              clearTimeout(hideTipTimer);
            }
          });
          document.addEventListener('mouseout', function (e) {
            var a = e.target.closest && (e.target.closest('a.sc-zh') || e.target.closest('#zh-tip'));
            if (a) {
              clearTimeout(hideTipTimer);
              hideTipTimer = window.setTimeout(hideZhTip, 220);
            }
          });
          document.addEventListener('scroll', function (e) {
            if (!tipEl.contains(e.target)) hideZhTip();
          }, true);
        } else {
          document.addEventListener('click', function (e) {
            var a = e.target.closest && e.target.closest('a.sc-zh');
            if (a) {
              if (tipTarget === a && tipEl.classList.contains('visible')) return;
              e.preventDefault();
              e.stopPropagation();
              showZhTip(a);
              return;
            }
            if (!tipEl.contains(e.target)) hideZhTip();
          }, true);
        }
      }

      // -------------------------------------------------------------------
      // 9. BOOTSTRAP
      // -------------------------------------------------------------------
      function bootstrapApp() {
        try {
          loadSavedLanguage();
          loadUnlockState();
          initEvents();
          applyAccessLockState();
          renderAll();
        } catch (err) {
          console.error('Failed to initialize James 5:7–20 unit page:', err);
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', bootstrapApp);
      } else {
        bootstrapApp();
      }
    })();
  </script>
</body>
</html>
