      var CUV_CHAPTER_CACHE = {};

      function cleanZhText(t) {
        return String(t || '')
          .replace(/\s+/g, ' ')
          .replace(/([\u3000-\u303f\u4e00-\u9fff\uff00-\uffef“”‘’])\s+(?=[\u3000-\u303f\u4e00-\u9fff\uff00-\uffef“”‘’])/g, '$1')
          .trim();
      }

      function parseSingleRef(raw) {
        var clean = String(raw || '').replace(/–/g, '-').trim();
        var m = clean.match(/^([1-3]?[A-Za-z]+)\s+(\d+)(?::(\d+)(?:-(\d+):(\d+)|-(\d+))?)?$/);
        if (!m || !BOOKS[m[1]]) return null;
        var bookCode = m[1];
        var sc = parseInt(m[2], 10);
        var sv = m[3] ? parseInt(m[3], 10) : null;
        var ec = m[4] ? parseInt(m[4], 10) : sc;
        var ev = m[5] ? parseInt(m[5], 10) : (m[6] ? parseInt(m[6], 10) : sv);
        return {
          key: bookCode + ' ' + clean.slice(bookCode.length).trim(),
          bookCode: bookCode,
          book: BOOKS[bookCode],
          sc: sc,
          sv: sv,
          ec: ec,
          ev: ev
        };
      }

      function formatRefLabel(parsed, lang) {
        var range = String(parsed.sc);
        if (parsed.sv !== null) {
          range += ':' + parsed.sv;
          if (parsed.ev !== null && (parsed.ec !== parsed.sc || parsed.ev !== parsed.sv)) {
            range += (lang === 'zh' ? '–' : '-') + (parsed.ec !== parsed.sc ? (parsed.ec + ':' + parsed.ev) : parsed.ev);
          }
        }
        return lang === 'zh'
          ? (parsed.book.zh + ' ' + range)
          : (parsed.book.enShort + ' ' + range);
      }

      function buildScriptureHTML(raw) {
        var parsed = parseSingleRef(raw);
        if (!parsed) return raw;
        if (appState.lang === 'zh') {
          var labelZh = formatRefLabel(parsed, 'zh');
          var wdUrl = 'https://wd.bible/bible/verse/' + parsed.book.wd + '.' + parsed.sc + '.' + (parsed.sv || 1) + '.cunps';
          return (
            '<a class="sc-zh" href="' + wdUrl + '" target="_blank" rel="noopener noreferrer" ' +
            'data-refkey="' + parsed.key + '" data-gb="' + parsed.book.gb + '" ' +
            'data-sc="' + parsed.sc + '" data-sv="' + (parsed.sv === null ? '' : parsed.sv) + '" ' +
            'data-ec="' + parsed.ec + '" data-ev="' + (parsed.ev === null ? '' : parsed.ev) + '" ' +
            'data-full="' + labelZh + '">' + labelZh + '</a>'
          );
        }
        var labelEn = formatRefLabel(parsed, 'en');
        var fullRefEn = parsed.book.enFull + ' ' + labelEn.slice(parsed.book.enShort.length).trim();
        var refLyUrl = 'https://ref.ly/' + encodeURIComponent(fullRefEn) + ';lsb';
        return (
          '<span class="sc-en"><a href="' + refLyUrl + '" target="_blank" rel="noopener noreferrer" data-ref="' + fullRefEn + '">' +
          labelEn + '</a></span>'
        );
      }

      function renderRichText(str) {
        return String(str || '').replace(/\[\[(.+?)\]\]/g, function (_, ref) {
          return buildScriptureHTML(ref);
        });
      }

      function fetchChapterCuv(gbBookNum, chapterNum) {
        var cacheKey = gbBookNum + '/' + chapterNum;
        if (!CUV_CHAPTER_CACHE[cacheKey]) {
          CUV_CHAPTER_CACHE[cacheKey] = fetch('https://api.getbible.net/v2/cus/' + gbBookNum + '/' + chapterNum + '.json')
            .then(function (r) {
              if (!r.ok) throw new Error('HTTP ' + r.status);
              return r.json();
            })
            .then(function (json) {
              return (json.verses || []).map(function (v) {
                return { c: Number(v.chapter || chapterNum), v: Number(v.verse), t: cleanZhText(v.text) };
              });
            })
            .catch(function (err) {
              delete CUV_CHAPTER_CACHE[cacheKey];
              throw err;
            });
        }
        return CUV_CHAPTER_CACHE[cacheKey];
      }

      function getCuvTooltipText(d) {
        var key = d.refkey;
        var gb = Number(d.gb);
        var sc = Number(d.sc);
        var sv = d.sv !== '' ? Number(d.sv) : null;
        var ec = Number(d.ec);
        var ev = d.ev !== '' ? Number(d.ev) : null;
        var maxVerses = 5;

        var est = sv === null ? 10 : (ec === sc ? (ev - sv + 1) : 10);
        if (est > maxVerses && CUV_FALLBACK[key]) {
          return Promise.resolve(CUV_FALLBACK[key]);
        }

        var chapters = [];
        for (var c = sc; c <= ec; c++) chapters.push(c);

        return Promise.all(chapters.map(function (ch) { return fetchChapterCuv(gb, ch); }))
          .then(function (lists) {
            var collected = [];
            var truncated = false;
            lists.forEach(function (vs, idx) {
              var ch = chapters[idx];
              vs.forEach(function (item) {
                var from = (sv === null) ? 1 : (ch === sc ? sv : 1);
                var to = (sv === null) ? 999 : (ch === ec ? ev : 999);
                if (item.v >= from && item.v <= to) {
                  if (collected.length < maxVerses) {
                    collected.push(item.t);
                  } else {
                    truncated = true;
                  }
                }
              });
            });
            if (!collected.length) return CUV_FALLBACK[key] || '点击打开微读圣经查阅完整经文。';
            return collected.join('') + (truncated ? '……' : '');
          })

            return CUV_FALLBACK[key] || '点击打开微读圣经查阅完整经文。';

        var below = rect.bottom + 8;

            var headerBg = c.isAuthor ? 'bg-navy text-white' : 'bg-parchmentDeep/65 text-navy';
            var badgeCls = c.isAuthor
              ? 'bg-gold text-white'
              : 'bg-white text-inkMuted border border-parchmentBorder';
            var refsHtml = c.refs.map(buildScriptureHTML).join(sep);

            return (
              '<article class="bg-white rounded-2xl border ' + cardBorder + ' shadow-card overflow-hidden flex flex-col">' +
                '<div class="px-5 py-3.5 border-b border-parchmentBorder flex items-center justify-between gap-2 ' + headerBg + '">' +
                  '<h3 class="font-serif text-lg font-bold">' + c.name[lang] + '</h3>' +
                  '<span class="text-[11px] font-semibold px-2.5 py-0.5 rounded-full shrink-0 ' + badgeCls + '">' + c.status[lang] + '</span>' +
                '</div>' +
                '<div class="p-5 space-y-3 flex-1">' +
                  '<p class="text-xs sm:text-sm text-ink leading-relaxed">' + c.note[lang] + '</p>' +
                  '<div class="pt-2 border-t border-parchmentBorder/70 text-xs text-inkMuted leading-relaxed">' +
                    '<span class="font-semibold text-navy mr-1.5">' + (lang === 'zh' ? '相关经文：' : 'References: ') + '</span>' +
                    refsHtml +
                  '</div>' +
                '</div>' +
              '</article>'
            );
          }).join('');
        }

        var datingEl = document.getElementById('datingCard');
        if (datingEl) {
          datingEl.innerHTML =
            '<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pb-3 mb-3 border-b border-parchmentBorder">' +
              '<span class="inline-block text-xs font-bold tracking-[0.16em] text-gold">' + DATING_INFO.badge[lang] + '</span>' +
              '<span class="font-serif text-base sm:text-lg font-bold text-navy">' + DATING_INFO.headline[lang] + '</span>' +
            '</div>' +
            '<p class="text-xs sm:text-sm text-ink leading-relaxed">' + renderRichText(DATING_INFO.body[lang]) + '</p>';
        }

        var desigGrid = document.getElementById('designationGrid');
        if (desigGrid) {
          desigGrid.innerHTML = DESIGNATION_CARDS.map(function (card) {
            return (
              '<div class="bg-white rounded-2xl border border-parchmentBorder shadow-card p-5 space-y-2.5">' +
                '<div class="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-parchmentDeep text-gold font-serif font-bold text-sm">' + card.num + '</div>' +
                '<h4 class="font-serif text-lg font-bold text-navy">' + card.title[lang] + '</h4>' +
                '<p class="text-xs sm:text-sm text-inkMuted leading-relaxed">' + renderRichText(card.body[lang]) + '</p>' +
              '</div>'
            );
          }).join('');
        }
      }

      function renderTribesAndAudience() {
        var lang = appState.lang;
        var isZh = lang === 'zh';

        var compareEl = document.getElementById('tribesCompareCard');
        if (compareEl) {
          var otPills = TRIBES_OT[lang].map(function (name, idx) {
            var isDan = idx === 6;
            var cls = isDan
              ? 'bg-amber-50 border-gold text-navy font-semibold'
              : 'bg-parchment/80 border-parchmentBorder text-ink';
            return '<span class="px-2.5 py-1 rounded-lg border text-xs ' + cls + '">' + name + '</span>';
          }).join('');

          var revPills = TRIBES_REV[lang].map(function (name) {
            return '<span class="px-2.5 py-1 rounded-lg border border-parchmentBorder bg-parchment/80 text-xs text-ink">' + name + '</span>';
          }).join('');

          compareEl.innerHTML =
            '<div class="px-5 py-4 bg-parchmentDeep/75 border-b border-parchmentBorder">' +
              '<h3 class="font-serif text-xl font-bold text-navy">' + (isZh ? '旧约与启示录中的十二支派对照' : 'Old Testament vs. Revelation Tribal Lists') + '</h3>' +
            '</div>' +
            '<div class="p-5 space-y-5">' +
              '<div>' +
                '<div class="flex items-baseline justify-between gap-2 mb-2.5">' +
                  '<span class="text-xs font-bold text-navy">' + (isZh ? '旧约中的十二支派' : 'Old Testament Twelve Tribes') + '</span>' +
                  '<span class="text-xs">' + buildScriptureHTML('Num 1:5-15') + '</span>' +
                '</div>' +
                '<div class="flex flex-wrap gap-2">' + otPills + '</div>' +
              '</div>' +
              '<div class="pt-4 border-t border-parchmentBorder">' +
                '<div class="flex items-baseline justify-between gap-2 mb-2.5">' +
                  '<span class="text-xs font-bold text-navy">' + (isZh ? '启示录中的十二支派' : 'Twelve Tribes in Revelation') + '</span>' +
                  '<span class="text-xs">' + buildScriptureHTML('Rev 7:5-8') + '</span>' +
                '</div>' +
                '<div class="flex flex-wrap gap-2">' + revPills + '</div>' +
              '</div>' +
              '<div class="rounded-xl bg-parchmentDeep/70 border border-parchmentBorder p-4 text-xs sm:text-sm text-ink leading-relaxed">' +
                '<div class="font-bold text-navy mb-1">' + (isZh ? '课堂延伸注解：为何启示录名单中不见“但”支派？' : 'Expository Note: Why Is Dan Omitted in Revelation?') + '</div>' +
                '<p>' + renderRichText(isZh
                  ? '北国分裂后，耶罗波安在伯特利与但设立金牛犊，使百姓陷在偶像崇拜之罪中（[[1Ki 12:28-30]]）。先知何西阿遂将原意为“神的殿”的伯特利讥称为“伯亚文”（罪孽/偶像之家，[[Hos 10:5]]），警示偶像崇拜的深重后果。'
                  : 'After the kingdom divided, Jeroboam set up golden calves at Bethel and Dan, leading Israel into idolatry ([[1Ki 12:28-30]]). Hosea consequently renamed Bethel (“House of God”) to Beth-aven (“House of Sin/Idols,” [[Hos 10:5]]).'
                ) + '</p>' +
              '</div>' +
            '</div>';
        }

        var audienceEl = document.getElementById('audienceEvidenceCard');
        if (audienceEl) {
          var evHtml = AUDIENCE_EVIDENCES.map(function (ev, idx) {
            return (
              '<li class="p-4 rounded-xl bg-parchment/75 border border-parchmentBorder/80 space-y-1.5">' +
                '<div class="flex items-center gap-2">' +
                  '<span class="w-5 h-5 rounded-full bg-navy text-white text-[11px] font-bold inline-flex items-center justify-center shrink-0">' + (idx + 1) + '</span>' +
                  '<h4 class="font-bold text-sm text-navy">' + ev.title[lang] + '</h4>' +
                '</div>' +
                '<p class="text-xs sm:text-sm text-inkMuted leading-relaxed pl-7">' + renderRichText(ev.body[lang]) + '</p>' +
              '</li>'
            );
          }).join('');

          audienceEl.innerHTML =
            '<div class="px-5 py-4 bg-parchmentDeep/75 border-b border-parchmentBorder">' +
              '<h3 class="font-serif text-xl font-bold text-navy">' + (isZh ? '受众结论：第一代犹太基督徒' : 'Conclusion: First-Generation Jewish Christians') + '</h3>' +
            '</div>' +
            '<ul class="p-5 space-y-3">' + evHtml + '</ul>';
        }
      }

      function renderDispersionAndCanon() {
        var lang = appState.lang;
        var dispGrid = document.getElementById('dispersionGrid');
        if (dispGrid) {
          dispGrid.innerHTML = DISPERSION_CARDS.map(function (card) {
            var pts = card.points[lang].map(function (pt) {
              return (
                '<li class="flex items-start gap-2.5 text-xs sm:text-sm text-ink leading-relaxed">' +
                  '<span class="w-1.5 h-1.5 rounded-full bg-gold mt-2 shrink-0"></span>' +
                  '<span>' + renderRichText(pt) + '</span>' +
                '</li>'
              );
            }).join('');

            return (
              '<article class="bg-white rounded-2xl border border-parchmentBorder shadow-card overflow-hidden flex flex-col">' +
                '<div class="px-5 py-4 bg-parchmentDeep/75 border-b border-parchmentBorder">' +
                  '<span class="inline-block text-[11px] font-bold tracking-[0.16em] text-gold mb-1">' + card.badge[lang] + '</span>' +
                  '<h3 class="font-serif text-xl font-bold text-navy">' + card.title[lang] + '</h3>' +
                '</div>' +
                '<ul class="p-5 space-y-2.5 flex-1">' + pts + '</ul>' +
              '</article>'
            );
          }).join('');
        }

        var canonGrid = document.getElementById('canonicalGrid');
        if (canonGrid) {
          canonGrid.innerHTML = CANONICAL_EPISTLES.map(function (ep, idx) {
            var isCurrent = idx === 2;
            var borderCls = isCurrent ? 'border-gold ring-1 ring-gold/30' : 'border-parchmentBorder';
            return (
              '<article class="bg-white rounded-2xl border ' + borderCls + ' shadow-card p-5 space-y-2.5 flex flex-col">' +
                '<div class="flex items-center justify-between gap-2">' +
                  '<span class="text-[11px] font-bold tracking-[0.12em] text-gold">' + ep.tag[lang] + '</span>' +
                  '<span class="text-xs">' + buildScriptureHTML(ep.ref) + '</span>' +
                '</div>' +
                '<h4 class="font-serif text-lg font-bold text-navy">' + ep.title[lang] + '</h4>' +
                '<p class="text-xs sm:text-sm text-inkMuted leading-relaxed flex-1">' + renderRichText(ep.desc[lang]) + '</p>' +
              '</article>'
            );
          }).join('');
        }
      }

      function renderPagerAndSitemap() {
        var lang = appState.lang;
        var dict = UI_TEXT[lang];

        var pager = document.getElementById('unitPager');
        if (pager) {
          pager.innerHTML =
            '<a href="index.html" class="group flex items-center gap-3 p-4 rounded-2xl bg-white border border-parchmentBorder hover:border-gold shadow-card transition-all">' +
              '<span class="w-9 h-9 rounded-xl bg-parchmentDeep text-navy group-hover:bg-navy group-hover:text-white flex items-center justify-center font-bold transition-colors shrink-0">←</span>' +
              '<div class="min-w-0">' +
                '<div class="text-[11px] font-semibold text-gold">' + dict.prevLabel + '</div>' +
                '<div class="font-serif text-sm sm:text-base font-bold text-navy truncate">' + dict.prevTitle + '</div>' +
              '</div>' +
            '</a>' +
            '<a href="james_1_2_27.html" class="group flex items-center justify-between gap-3 p-4 rounded-2xl bg-white border border-parchmentBorder hover:border-gold shadow-card transition-all text-right">' +
              '<div class="min-w-0 flex-1">' +
                '<div class="text-[11px] font-semibold text-gold">' + dict.nextLabel + '</div>' +
                '<div class="font-serif text-sm sm:text-base font-bold text-navy truncate">' + dict.nextTitle + '</div>' +
              '</div>' +
              '<span class="w-9 h-9 rounded-xl bg-parchmentDeep text-navy group-hover:bg-navy group-hover:text-white flex items-center justify-center font-bold transition-colors shrink-0">→</span>' +
            '</a>';
        }

        var sitemap = document.getElementById('footerSitemap');
        if (sitemap) {
          var homeItem =
            '<a href="index.html" class="flex items-center gap-2 px-3 py-2 rounded-lg bg-white/5 hover:bg-white/10 border border-white/10 text-slate-300 hover:text-white transition-colors">' +
              '<span class="px-1.5 py-0.5 rounded bg-white/10 text-goldLight text-[10px] font-bold shrink-0">' + dict.sitemapHomeTag + '</span>' +
              '<span class="truncate">' + dict.sitemapHomeLabel + '</span>' +
            '</a>';

          var items = SITEMAP_UNITS.map(function (u) {
            var cls = u.current
              ? 'bg-white/10 border-gold/50 text-white font-semibold'
              : 'bg-white/5 hover:bg-white/10 border-white/10 text-slate-300 hover:text-white';
            var refDisplay = lang === 'zh' ? ('雅 ' + u.ref) : ('James ' + u.ref.replace(/–/g, '-'));
            return (
              '<a href="' + u.href + '" class="flex items-center gap-2 px-3 py-2 rounded-lg border transition-colors ' + cls + '">' +
                '<span class="px-1.5 py-0.5 rounded ' + (u.current ? 'bg-gold text-white' : 'bg-white/10 text-goldLight') + ' text-[10px] font-bold shrink-0">' + u.marker[lang] + '</span>' +
                '<span class="truncate">' + refDisplay + ' · ' + u.title[lang] + '</span>' +
              '</a>'
            );
          }).join('');

          sitemap.innerHTML = homeItem + items;
        }
      }

      function renderAll() {
        hideZhTip();
        renderChrome();
        renderLexicon();
        renderAuthorship();
        renderTribesAndAudience();
        renderDispersionAndCanon();
        renderPagerAndSitemap();
        refreshReftagger();
      }

      // -------------------------------------------------------------------
      // 6. EVENTS
      // -------------------------------------------------------------------
      function initEvents() {
        var langToggleBtn = document.getElementById('btn-lang-toggle');
        if (langToggleBtn) {
          langToggleBtn.addEventListener('click', function () {
            appState.lang = appState.lang === 'zh' ? 'en' : 'zh';
            saveLanguage(appState.lang);
            renderAll();
          });
        }

        var mobileBtn = document.getElementById('mobileMenuBtn');
        var mobileMenu = document.getElementById('mobileMenu');
        if (mobileBtn && mobileMenu) {
          mobileBtn.addEventListener('click', function () {
            var isOpen = !mobileMenu.classList.contains('hidden');
            mobileMenu.classList.toggle('hidden', isOpen);
            mobileBtn.setAttribute('aria-expanded', String(!isOpen));
          });
          mobileMenu.querySelectorAll('.mobile-nav-link').forEach(function (link) {
            link.addEventListener('click', function () {
              mobileMenu.classList.add('hidden');
              mobileBtn.setAttribute('aria-expanded', 'false');
            });
          });
        }

        // Access Gate
        var gateForm = document.getElementById('accessGateForm');
        var pwdInput = document.getElementById('accessPasswordInput');
        var errMsg = document.getElementById('accessErrorMsg');
        var togglePwdBtn = document.getElementById('togglePasswordVisibility');
        var eyeShow = document.getElementById('eyeIconShow');
        var eyeHide = document.getElementById('eyeIconHide');

        if (togglePwdBtn && pwdInput) {
          togglePwdBtn.addEventListener('click', function () {
            var isHidden = pwdInput.type === 'password';
            pwdInput.type = isHidden ? 'text' : 'password';
            if (eyeShow && eyeHide) {
              eyeShow.classList.toggle('hidden', isHidden);
              eyeHide.classList.toggle('hidden', !isHidden);
            }
            var dict = UI_TEXT[appState.lang];
            togglePwdBtn.setAttribute('aria-label', isHidden ? dict.gateHidePwd : dict.gateShowPwd);
          });
        }

        if (pwdInput && errMsg) {
          pwdInput.addEventListener('input', function () {
            errMsg.classList.add('hidden');
            pwdInput.classList.remove('border-red-500', 'ring-1', 'ring-red-500');
          });
        }

        if (gateForm && pwdInput) {
          gateForm.addEventListener('submit', function (e) {
            e.preventDefault();
            var entered = String(pwdInput.value || '').trim();
            if (entered === ACCESS_PASSWORD) {
              appState.isUnlocked = true;
              saveUnlockState();
              if (errMsg) errMsg.classList.add('hidden');
              pwdInput.value = '';
              applyAccessLockState();
              refreshReftagger();
            } else {
              if (errMsg) errMsg.classList.remove('hidden');
              pwdInput.classList.add('border-red-500', 'ring-1', 'ring-red-500');
              pwdInput.focus();
              pwdInput.select();
            }
          });
        }

        document.querySelectorAll('a[href="#lexicon"], a[href="#author"], a[href="#tribes"], a[href="#dispersion"]').forEach(function (anchor) {
          anchor.addEventListener('click', function (e) {
            if (!appState.isUnlocked) {
              e.preventDefault();
              var gateEl = document.getElementById('accessGate');
              if (gateEl) gateEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
              if (pwdInput) window.setTimeout(function () { pwdInput.focus(); }, 250);
            }
          });
        });

        // Chinese Union Version hover/tap tooltip
        if (!isTouchDevice) {
          document.addEventListener('mouseover', function (e) {
            var a = e.target.closest && e.target.closest('a.sc-zh');
            if (a && a !== tipTarget) {
              showZhTip(a);
            } else if (a || (e.target.closest && e.target.closest('#zh-tip'))) {
              clearTimeout(hideTipTimer);
            }
          });
          document.addEventListener('mouseout', function (e) {
            var a = e.target.closest && (e.target.closest('a.sc-zh') || e.target.closest('#zh-tip'));
            if (a) {
              clearTimeout(hideTipTimer);
              hideTipTimer = window.setTimeout(hideZhTip, 220);
            }
          });
          document.addEventListener('scroll', function (e) {
            if (!tipEl.contains(e.target)) hideZhTip();
          }, true);
        } else {
          document.addEventListener('click', function (e) {
            var a = e.target.closest && e.target.closest('a.sc-zh');
            if (a) {
              if (tipTarget === a && tipEl.classList.contains('visible')) return;
              e.preventDefault();
              e.stopPropagation();
              showZhTip(a);
              return;
            }
            if (!tipEl.contains(e.target)) hideZhTip();
          }, true);
        }
      }

      // -------------------------------------------------------------------
      // 7. BOOTSTRAP
      // -------------------------------------------------------------------
      function bootstrap() {
        try {
          loadSavedLanguage();
          loadUnlockState();
          initEvents();
          applyAccessLockState();
          renderAll();
        } catch (err) {
          console.error('Failed to initialize James 1:1 page:', err);
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', bootstrap);
      } else {
        bootstrap();
      }
    })();
  </script>
