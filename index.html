  <style>
    html {
      scroll-behavior: smooth;

    body {
      background-color: #FBF8F1;
      color: #24221F;
      font-family: 'Inter', 'Noto Sans SC', system-ui, -apple-system, sans-serif;

    .hero-pattern {
      background-color: #17253B;
      background-image: radial-gradient(rgba(200, 163, 95, 0.14) 1px, transparent 1px);
      background-size: 24px 24px;
    }

    /* Scripture Citations — 中文和合本 (wd.bible + tooltip) & English LSB (ref.ly + Reftagger) */
    a.sc-zh {
      color: #6A3D12;
      text-decoration: none;
      border-bottom: 1px dotted rgba(106, 61, 18, 0.55);
      white-space: nowrap;
      cursor: pointer;
      transition: color 0.15s ease, background-color 0.15s ease;
    }

    a.sc-zh:hover {
      color: #9B2226;
      border-bottom-style: solid;
      background: rgba(201, 162, 39, 0.14);
      border-radius: 2px;
    }

    .sc-en {
      white-space: normal;
    }

    .sc-en a,
    a.rtBibleRef {
      color: #6A3D12 !important;
      text-decoration: none !important;
      border-bottom: 1px dotted rgba(106, 61, 18, 0.55);
      white-space: nowrap;
      transition: color 0.15s ease, background-color 0.15s ease;
    }

    .sc-en a:hover,
    a.rtBibleRef:hover {
      color: #9B2226 !important;
      border-bottom-style: solid;
      background: rgba(201, 162, 39, 0.14);
      border-radius: 2px;
    }

    /* High-contrast scripture citation styling inside active dark-navy chiasm rows */
    .chiasm-row-active a.sc-zh,
    .chiasm-row-active .sc-en a,
    .chiasm-row-active a.rtBibleRef {
      color: #FDE68A !important;
      border-bottom-color: rgba(253, 230, 138, 0.6);
    }

    .chiasm-row-active a.sc-zh:hover,
    .chiasm-row-active .sc-en a:hover,
    .chiasm-row-active a.rtBibleRef:hover {
      color: #FFFFFF !important;
      background: rgba(255, 255, 255, 0.14);

    /* Floating Chinese Union Version (和合本) Hover Tooltip */
    #zh-tip {
      position: fixed;
      z-index: 3000;
      display: none;
      max-height: 46vh;
      overflow: hidden;
      flex-direction: column;
      background: #FCF9F2;
      border: 1px solid #8B7B65;
      border-radius: 10px;
      box-shadow: 0 10px 28px rgba(43, 37, 32, 0.22);
      font-family: 'Kaiti SC', 'STKaiti', 'KaiTi', '楷体', 'Noto Serif SC', serif;
      color: #2B2520;
    }

    #zh-tip.visible {
      display: flex;
    }

    #zh-tip .zt-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      padding: 7px 12px;
      background: #EFE5CF;
      border-bottom: 1px solid #D9CBB2;
      font: 700 13px 'Noto Serif SC', serif;
      border-radius: 9px 9px 0 0;
    }

    #zh-tip .zt-ver {
      font: 500 11px 'Noto Sans SC', sans-serif;
      color: #6A5B49;
    }

    #zh-tip .zt-body {
      padding: 9px 12px;
      font-size: 14.5px;
      line-height: 1.75;
      overflow-y: auto;
    }

    #zh-tip .zt-muted {
      color: #7A6955;
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 12px;
    }
  </style>

      };

      var CUV_CHAPTER_CACHE = {};

      function cleanZhText(t) {
        return String(t || '')
          .replace(/\s+/g, ' ')
          .replace(/([\u3000-\u303f\u4e00-\u9fff\uff00-\uffef“”‘’])\s+(?=[\u3000-\u303f\u4e00-\u9fff\uff00-\uffef“”‘’])/g, '$1')
          .trim();
      }

      function parseJamesRef(raw) {
        var clean = String(raw || '').replace(/^(?:Jas|James|雅)\s*/i, '').replace(/–/g, '-').trim();
        var m = clean.match(/^(\d+):(\d+)(?:-(\d+):(\d+)|-(\d+))?$/);
        if (!m) {
          return { key: clean, sc: 1, sv: 1, ec: 1, ev: 1 };
        }
        var sc = parseInt(m[1], 10);
        var sv = parseInt(m[2], 10);
        var ec = m[3] ? parseInt(m[3], 10) : sc;
        var ev = m[4] ? parseInt(m[4], 10) : (m[5] ? parseInt(m[5], 10) : sv);
        return { key: clean, sc: sc, sv: sv, ec: ec, ev: ev };
      }

      function formatDisplayRef(raw, lang) {
        var clean = String(raw || '').replace(/^(?:Jas|James|雅)\s*/i, '').trim();
        var zhDisplay = clean.replace(/-/g, '–');
        var enDisplay = clean.replace(/–/g, '-');
        return lang === 'zh' ? ('雅 ' + zhDisplay) : ('James ' + enDisplay);
      }

      function buildScriptureHTML(raw) {
        var parsed = parseJamesRef(raw);
        if (appState.lang === 'zh') {
          var labelZh = formatDisplayRef(raw, 'zh');
          var wdUrl = 'https://wd.bible/bible/verse/jas.' + parsed.sc + '.' + parsed.sv + '.cunps';
          return (
            '<a class="sc-zh" href="' + wdUrl + '" target="_blank" rel="noopener noreferrer" ' +
            'data-refkey="' + parsed.key + '" data-sc="' + parsed.sc + '" data-sv="' + parsed.sv + '" ' +
            'data-ec="' + parsed.ec + '" data-ev="' + parsed.ev + '" data-full="' + labelZh + '">' +
            labelZh + '</a>'
          );
        }
        var labelEn = formatDisplayRef(raw, 'en');
        var refLyUrl = 'https://ref.ly/' + encodeURIComponent(labelEn) + ';lsb';
        return (
          '<span class="sc-en"><a href="' + refLyUrl + '" target="_blank" rel="noopener noreferrer" data-ref="' + labelEn + '">' +
          labelEn + '</a></span>'
        );
      }

      function renderRichText(str) {
        return String(str || '').replace(/\[\[(.+?)\]\]/g, function (_, ref) {
          return buildScriptureHTML(ref);
        });
      }

      function fetchJamesChapterCuv(chapterNum) {
        if (!CUV_CHAPTER_CACHE[chapterNum]) {
          CUV_CHAPTER_CACHE[chapterNum] = fetch('https://api.getbible.net/v2/cus/59/' + chapterNum + '.json')
            .then(function (r) {
              if (!r.ok) throw new Error('HTTP ' + r.status);
              return r.json();
            })
            .then(function (json) {
              return (json.verses || []).map(function (v) {
                return { c: Number(v.chapter || chapterNum), v: Number(v.verse), t: cleanZhText(v.text) };
              });
            })
            .catch(function (err) {
              delete CUV_CHAPTER_CACHE[chapterNum];
              throw err;
            });
        }
        return CUV_CHAPTER_CACHE[chapterNum];
      }

      function getCuvTooltipText(dataset) {
        var key = dataset.refkey;
        var sc = Number(dataset.sc);
        var sv = Number(dataset.sv);
        var ec = Number(dataset.ec);
        var ev = Number(dataset.ev);
        var maxVerses = 5;

        // If a curated fallback with clean ellipsis exists for a long passage, prefer immediate display
        var totalEstimated = (ec === sc) ? (ev - sv + 1) : 10;
        if (totalEstimated > maxVerses && CUV_FALLBACK[key]) {
          return Promise.resolve(CUV_FALLBACK[key]);
        }

        var chapters = [];
        for (var c = sc; c <= ec; c++) chapters.push(c);

        return Promise.all(chapters.map(fetchJamesChapterCuv))
          .then(function (lists) {
            var collected = [];
            var truncated = false;
            lists.forEach(function (vs, idx) {
              var ch = chapters[idx];
              vs.forEach(function (item) {
                var from = (ch === sc) ? sv : 1;
                var to = (ch === ec) ? ev : 999;
                if (item.v >= from && item.v <= to) {
                  if (collected.length < maxVerses) {
                    collected.push(item.t);
                  } else {
                    truncated = true;
                  }
                }
              });
            });
            if (!collected.length) {
              return CUV_FALLBACK[key] || '点击打开微读圣经查阅完整经文。';
            }
            return collected.join('') + (truncated ? '……' : '');
          })
          .catch(function () {
            return CUV_FALLBACK[key] || '点击打开微读圣经查阅完整经文。';
          });
      }

      // Floating tooltip DOM element
      var tipEl = document.createElement('div');
      tipEl.id = 'zh-tip';
      tipEl.setAttribute('role', 'tooltip');
      document.body.appendChild(tipEl);

      var isTouchDevice = window.matchMedia && window.matchMedia('(hover: none)').matches;
      var tipTarget = null;
      var hideTipTimer = null;

      function positionTip(anchor) {
        var rect = anchor.getBoundingClientRect();
        var width = Math.min(360, window.innerWidth - 16);
        tipEl.style.width = width + 'px';
        var left = Math.min(Math.max(8, rect.left + rect.width / 2 - width / 2), window.innerWidth - width - 8);
        tipEl.style.left = left + 'px';
        var height = tipEl.offsetHeight || 120;
        var below = rect.bottom + 8;
        var above = rect.top - height - 8;
        tipEl.style.top = (below + height < window.innerHeight - 8 || above < 8 ? below : above) + 'px';
      }

      function showZhTip(anchor) {
        clearTimeout(hideTipTimer);
        tipTarget = anchor;
        var d = anchor.dataset;
        var immediateText = CUV_FALLBACK[d.refkey];
        tipEl.innerHTML =
          '<div class="zt-head"><span>' + d.full + '</span><span class="zt-ver">和合本</span></div>' +
          '<div class="zt-body">' + (immediateText ? immediateText : '<span class="zt-muted">经文载入中……</span>') + '</div>';
        tipEl.classList.add('visible');
        positionTip(anchor);

        getCuvTooltipText(d).then(function (text) {
          if (tipTarget !== anchor) return;
          var bodyEl = tipEl.querySelector('.zt-body');
          if (bodyEl) {
            bodyEl.textContent = text;
            positionTip(anchor);
          }
        });
      }

      function hideZhTip() {
        tipEl.classList.remove('visible');
        tipTarget = null;
      }

      // -------------------------------------------------------------------
      // 7. LOGOS REFTAGGER V2 (ENGLISH LSB HOVER)
      // -------------------------------------------------------------------
      window.refTagger = {
        settings: {
          bibleVersion: 'LSB',
          socialSharing: [],
          tooltipStyle: 'light',
          roundCorners: true,
          convertHyperlinks: true,
          tagChapters: true,
          noSearchClassNames: ['sc-zh', 'no-rt'],
          customStyle: {
            heading: { backgroundColor: '#EFE5CF', color: '#2B2520' },
            body: { color: '#2B2520' }
          }
        }
      };

      (function loadRefTagger() {
        try {
          var s = document.createElement('script');
          s.src = 'https://api.reftagger.com/v2/RefTagger.js';
          s.async = true;
          s.onload = function () {
            refreshReftagger();
          };
          document.body.appendChild(s);
        } catch (err) {
          // Ignore in restricted environments
        }
      })();

      function refreshReftagger() {
        if (appState.lang !== 'en' || !appState.isUnlocked) return;
        var run = function () {
          try {
            if (window.refTagger && typeof window.refTagger.tag === 'function') {
              window.refTagger.tag(document.getElementById('protectedContent'));
            }
          } catch (err) {
            // Safe fallback: direct ref.ly links remain clickable
          }
        };
        run();
        window.setTimeout(run, 500);
      }

      // -------------------------------------------------------------------
      // 8. PERSISTENCE & ACCESS LOCK STATE
      // -------------------------------------------------------------------
      function loadSavedLanguage() {
        try {
          var saved = window.localStorage.getItem(STORAGE_KEY_LANG);
          if (saved === 'zh' || saved === 'en') appState.lang = saved;
        } catch (err) {}
      }

      function saveLanguage(lang) {
        try {
          window.localStorage.setItem(STORAGE_KEY_LANG, lang);
        } catch (err) {}
      }

      function loadUnlockState() {
        try {
          appState.isUnlocked = window.sessionStorage.getItem(STORAGE_KEY_AUTH) === '1';
        } catch (err) {
          appState.isUnlocked = false;
        }
      }

      function saveUnlockState() {
        try {
          window.sessionStorage.setItem(STORAGE_KEY_AUTH, '1');
        } catch (err) {}
      }

      function applyAccessLockState() {
        var gateEl = document.getElementById('accessGate');
        var contentEl = document.getElementById('protectedContent');
        var footerEl = document.getElementById('protectedFooter');

        if (gateEl) gateEl.classList.toggle('hidden', appState.isUnlocked);
        if (contentEl) contentEl.classList.toggle('hidden', !appState.isUnlocked);
        if (footerEl) footerEl.classList.toggle('hidden', !appState.isUnlocked);
      }

      // -------------------------------------------------------------------
      // 9. RENDERERS
      // -------------------------------------------------------------------
      function getUnitById(id) {
        for (var i = 0; i < UNITS.length; i++) {
          if (UNITS[i].id === id) return UNITS[i];
        }
        return UNITS[0];
      }

      function renderStaticChrome() {
        var lang = appState.lang;
        var dict = UI_TEXT[lang];
        var isZh = lang === 'zh';

        document.documentElement.lang = isZh ? 'zh-CN' : 'en';
        document.title = dict.pageTitle;

        var brandEmblem = document.getElementById('brandEmblem');
        var footerEmblem = document.getElementById('footerEmblem');
        if (brandEmblem) brandEmblem.textContent = dict.emblem;
        if (footerEmblem) footerEmblem.textContent = dict.emblem;

        // Segmented toggle styling
        var pillZh = document.getElementById('lang-pill-zh');
        var pillEn = document.getElementById('lang-pill-en');
        var toggleBtn = document.getElementById('btn-lang-toggle');
        if (pillZh && pillEn) {
          pillZh.className = isZh
            ? 'px-2 py-1 rounded-md bg-navy text-parchment transition-colors'
            : 'px-2 py-1 rounded-md text-[#3b3228] transition-colors';

            ? 'px-2 py-1 rounded-md bg-navy text-parchment transition-colors'
            : 'px-2 py-1 rounded-md text-[#3b3228] transition-colors';
        }

        document.querySelectorAll('[data-i18n]').forEach(function (el) {

          if (dict[key] !== undefined) el.textContent = dict[key];
        });

        // Chiasm subtitle with interactive citation
        var chiasmSub = document.getElementById('chiasmSubtitle');
        if (chiasmSub) {
          chiasmSub.innerHTML = isZh
            ? renderRichText('雅各书并非零散的箴言汇编，而是围绕“从上头来的清洁智慧”（[[Jas 3:13-18]]）精心构建的同心交叉对称书信。点击或悬停任意一层，即可同步高亮对称双翼并查阅对比解经要点。')
            : renderRichText('Rather than a loose collection of proverbs, James is crafted as a symmetrical chiasm centered on pure wisdom from above ([[Jas 3:13-18]]). Select or hover any tier to highlight its parallel wing and inspect comparative insights.');
        }

        var diagTitle = document.getElementById('chiasmDiagramTitle');
        if (diagTitle) diagTitle.textContent = dict.chiasmDiagramTitle;

        var pwdInput = document.getElementById('accessPasswordInput');

        if (togglePwdBtn && pwdInput) {
          togglePwdBtn.setAttribute('aria-label', pwdInput.type === 'password' ? dict.gateShowPwd : dict.gateHidePwd);
        }
      }

      function renderChiasm() {
        var lang = appState.lang;
        var dict = UI_TEXT[lang];
        var diagramEl = document.getElementById('chiasmDiagram');
        var detailEl = document.getElementById('chiasmDetailPanel');
        if (!diagramEl || !detailEl) return;

        // Render left arch diagram (uniform styling across all tiers including D)
        diagramEl.innerHTML = CHIASM_ARCH_NODES.map(function (node) {
          var unit = getUnitById(node.unitId);
          var isActive = appState.activeChiasmKey === node.key;
          var rowCls = isActive
            ? 'chiasm-row-active bg-navy text-white border-navy shadow-md'
            : 'bg-parchment/60 hover:bg-parchmentDeep/80 text-navy border-parchmentBorder';
          var badgeCls = isActive
            ? 'bg-gold text-white border-gold'
            : 'bg-white text-navy border-parchmentBorder';
          var subCls = isActive ? 'text-slate-200' : 'text-inkMuted';

          return (
            '<div class="' + node.indent + '">' +
              '<div role="button" tabindex="0" data-chiasm-key="' + node.key + '" ' +
              'class="chiasm-node-btn w-full text-left px-3.5 py-3 rounded-xl border transition-all flex items-center gap-3 cursor-pointer ' + rowCls + '">' +
                '<span class="min-w-[2.4rem] px-2 h-8 rounded-lg border text-xs font-bold flex items-center justify-center shrink-0 ' + badgeCls + '">' +
                  unit.marker[lang] +
                '</span>' +
                '<div class="min-w-0 flex-1">' +
                  '<div class="text-xs font-bold tracking-wide">' + buildScriptureHTML(unit.ref) + '</div>' +
                  '<div class="text-xs sm:text-sm font-semibold truncate ' + subCls + '">' + unit.title[lang] + ' · ' + unit.shortDesc[lang] + '</div>' +
                '</div>' +
                '<svg class="w-4 h-4 shrink-0 opacity-60" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">' +
                  '<path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>' +
                '</svg>' +
              '</div>' +
            '</div>'
          );
        }).join('');

        // Bind hover, click & keyboard handlers
        diagramEl.querySelectorAll('.chiasm-node-btn').forEach(function (btn) {
          var key = btn.getAttribute('data-chiasm-key');
          btn.addEventListener('click', function (e) {
            if (e.target.closest && e.target.closest('a.sc-zh, .sc-en a, a.rtBibleRef')) return;
            if (appState.activeChiasmKey !== key) {
              appState.activeChiasmKey = key;
              renderChiasm();
              refreshReftagger();
            }
          });
          btn.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              if (appState.activeChiasmKey !== key) {
                appState.activeChiasmKey = key;
                renderChiasm();
                refreshReftagger();
              }
            }
          });
          btn.addEventListener('mouseenter', function () {
            if (appState.activeChiasmKey !== key) {
              appState.activeChiasmKey = key;
              renderChiasm();
              refreshReftagger();
            }
          });
        });

        // Render right comparative detail panel
        var group = CHIASM_GROUPS[appState.activeChiasmKey] || CHIASM_GROUPS.centerD;
        var refsHtml = group.refs.map(buildScriptureHTML).join(' <span class="text-inkMuted mx-1">↔</span> ');

        var bulletsHtml = group.bullets[lang].map(function (b) {
          return (
            '<li class="flex items-start gap-2.5 text-xs sm:text-sm text-ink leading-relaxed">' +
              '<span class="w-1.5 h-1.5 rounded-full bg-gold mt-2 shrink-0"></span>' +
              '<span>' + renderRichText(b) + '</span>' +
            '</li>'
          );
        }).join('');

        var unitLinksHtml = group.unitIds.map(function (uid) {
          var u = getUnitById(uid);
          return (
            '<div class="group flex items-center justify-between gap-3 px-4 py-3 rounded-xl border border-parchmentBorder bg-parchment/70 hover:bg-parchmentDeep hover:border-gold/60 transition-all">' +
              '<div class="min-w-0">' +
                '<div class="flex items-center gap-2">' +
                  '<span class="px-1.5 py-0.5 rounded bg-white border border-parchmentBorder text-[11px] font-bold text-navy">' + u.marker[lang] + '</span>' +
                  '<span class="text-xs font-semibold">' + buildScriptureHTML(u.ref) + '</span>' +
                '</div>' +
                '<a href="' + u.href + '" class="block text-sm font-bold text-navy hover:text-gold mt-1 truncate transition-colors">' + u.title[lang] + '（' + u.weeks[lang] + '）</a>' +
              '</div>' +
              '<a href="' + u.href + '" class="text-xs font-semibold text-gold group-hover:translate-x-0.5 transition-transform shrink-0">' + dict.chiasmEnterUnit + ' →</a>' +
            '</div>'
          );
        }).join('');

        // Bind hover & click handlers
        diagramEl.querySelectorAll('.chiasm-node-btn').forEach(function (btn) {
          var key = btn.getAttribute('data-chiasm-key');
          btn.addEventListener('click', function () {
            if (appState.activeChiasmKey !== key) {
              appState.activeChiasmKey = key;
              renderChiasm();
              refreshReftagger();
            }
          });
          btn.addEventListener('mouseenter', function () {
            if (appState.activeChiasmKey !== key) {
              appState.activeChiasmKey = key;
              renderChiasm();
              refreshReftagger();
            }
          });
        });

        // Render right comparative detail panel
        var group = CHIASM_GROUPS[appState.activeChiasmKey] || CHIASM_GROUPS.centerD;
        var refsHtml = group.refs.map(buildScriptureHTML).join(' <span class="text-inkMuted mx-1">↔</span> ');

        var bulletsHtml = group.bullets[lang].map(function (b) {
          return (
            '<li class="flex items-start gap-2.5 text-xs sm:text-sm text-ink leading-relaxed">' +
              '<span class="w-1.5 h-1.5 rounded-full bg-gold mt-2 shrink-0"></span>' +
              '<span>' + renderRichText(b) + '</span>' +
            '</li>'
          );
        }).join('');

        var unitLinksHtml = group.unitIds.map(function (uid) {
          var u = getUnitById(uid);
          return (
            '<a href="' + u.href + '" class="group flex items-center justify-between gap-3 px-4 py-3 rounded-xl border border-parchmentBorder bg-parchment/70 hover:bg-parchmentDeep hover:border-gold/60 transition-all">' +
              '<div class="min-w-0">' +
                '<div class="flex items-center gap-2">' +
                  '<span class="px-1.5 py-0.5 rounded bg-white border border-parchmentBorder text-[11px] font-bold text-navy">' + u.marker[lang] + '</span>' +
                  '<span class="text-xs font-semibold text-gold">' + formatDisplayRef(u.ref, lang) + '</span>' +
                '</div>' +
                '<div class="text-sm font-bold text-navy mt-1 truncate">' + u.title[lang] + '（' + u.weeks[lang] + '）</div>' +
              '</div>' +
              '<span class="text-xs font-semibold text-gold group-hover:translate-x-0.5 transition-transform shrink-0">' + dict.chiasmEnterUnit + ' →</span>' +
            '</a>'
          );
        }).join('');

        // Dedicated final section inside D for Central Book Thesis
        var centralThesisHtml = group.includeCentralThesis
          ? (
            '<div class="mt-5 pt-5 border-t border-parchmentBorder">' +
              '<div class="rounded-xl bg-parchmentDeep/85 border border-gold/40 px-4 py-3.5">' +
                '<div class="text-[11px] font-bold tracking-[0.16em] text-gold mb-1.5">' + dict.chiasmThesisHeading + '</div>' +
                '<p class="font-serif text-base sm:text-lg font-bold text-navy leading-snug">' + dict.chiasmThesisText + '</p>' +
              '</div>' +
            '</div>'
          )
          : '';

        detailEl.innerHTML =
          '<div class="px-5 py-4 bg-parchmentDeep/75 border-b border-parchmentBorder">' +
            '<div class="flex flex-wrap items-center justify-between gap-2 mb-2.5">' +
              '<span class="inline-block px-3 py-1 rounded-full bg-navy text-white text-xs font-semibold">' + group.badge[lang] + '</span>' +
              '<div class="text-xs font-semibold">' + refsHtml + '</div>' +
            '</div>' +
            '<h3 class="font-serif text-xl sm:text-2xl font-bold text-navy leading-snug">' + group.title[lang] + '</h3>' +
          '</div>' +
          '<div class="p-5 space-y-4">' +
            '<p class="text-xs sm:text-sm text-inkMuted leading-relaxed">' + group.summary[lang] + '</p>' +
            '<div class="rounded-xl bg-parchment/80 border border-parchmentBorder p-4">' +
              '<div class="text-xs font-bold text-navy mb-2.5">' + dict.chiasmCompareHeading + '</div>' +
              '<ul class="space-y-2">' + bulletsHtml + '</ul>' +
            '</div>' +
            '<div class="space-y-2.5">' + unitLinksHtml + '</div>' +
            centralThesisHtml +
          '</div>';
      }

      function renderUnits() {
        var lang = appState.lang;
        var dict = UI_TEXT[lang];
        var grid = document.getElementById('unitsGrid');
        if (!grid) return;

        grid.innerHTML = UNITS.map(function (u) {
          var ptsHtml = u.points[lang].map(function (pt) {
            return (
              '<li class="flex items-start gap-2 text-xs text-inkMuted leading-relaxed">' +
                '<span class="w-1 h-1 rounded-full bg-gold mt-2 shrink-0"></span>' +
                '<span>' + renderRichText(pt) + '</span>' +
              '</li>'
            );
          }).join('');

          return (
            '<article class="bg-white rounded-2xl border border-parchmentBorder shadow-card hover:border-gold/70 hover:-translate-y-0.5 transition-all flex flex-col overflow-hidden">' +
              '<div class="px-5 py-4 bg-parchmentDeep/60 border-b border-parchmentBorder flex items-center justify-between gap-2">' +
                '<div class="flex items-center gap-2">' +
                  '<span class="px-2 py-0.5 rounded-md bg-navy text-white text-xs font-bold">' + u.marker[lang] + '</span>' +
                  '<span class="text-xs font-bold">' + buildScriptureHTML(u.ref) + '</span>' +
                '</div>' +
                '<span class="text-[11px] font-medium px-2 py-0.5 rounded-full bg-white border border-parchmentBorder text-inkMuted">' + u.weeks[lang] + '</span>' +
              '</div>' +
              '<div class="p-5 flex-1 flex flex-col">' +
                '<h3 class="font-serif text-lg font-bold text-navy mb-1.5 leading-snug">' + u.title[lang] + '</h3>' +
                '<p class="text-xs text-inkMuted mb-3.5">' + u.shortDesc[lang] + '</p>' +
                '<ul class="space-y-2 mb-5 flex-1">' + ptsHtml + '</ul>' +
                '<a href="' + u.href + '" class="inline-flex items-center justify-between px-4 py-2.5 rounded-xl bg-parchment hover:bg-navy text-navy hover:text-white border border-parchmentBorder hover:border-navy text-xs font-semibold transition-colors">' +
                  '<span>' + dict.enterPageBtn + '</span>' +
                  '<span>→</span>' +
                '</a>' +
              '</div>' +
            '</article>'
          );
        }).join('');
      }

      function renderTheology() {
        var lang = appState.lang;
        var dict = UI_TEXT[lang];
        var tabsEl = document.getElementById('theologyTabs');
        var gridEl = document.getElementById('theologyGrid');
        if (!tabsEl || !gridEl) return;

        var tabs = [
          { id: 'all', label: dict.tabAll },
          { id: 'theologyProper', label: dict.tabTheologyProper },
          { id: 'christology', label: dict.tabChristology },
          { id: 'eschatology', label: dict.tabEschatology },
          { id: 'soteriology', label: dict.tabSoteriology }
        ];

        tabsEl.innerHTML = tabs.map(function (t) {
          var active = appState.activeTheologyTab === t.id;
          var cls = active
            ? 'bg-navy text-white border-navy shadow-sm'
            : 'bg-white text-inkMuted border-parchmentBorder hover:bg-parchmentDeep hover:text-navy';
          return (
            '<button type="button" role="tab" aria-selected="' + active + '" data-theo-tab="' + t.id + '" ' +
            'class="theo-tab-btn px-3.5 py-2 rounded-xl border text-xs font-semibold transition-colors ' + cls + '">' +
              t.label +
            '</button>'
          );
        }).join('');

        tabsEl.querySelectorAll('.theo-tab-btn').forEach(function (btn) {
          btn.addEventListener('click', function () {
            appState.activeTheologyTab = btn.getAttribute('data-theo-tab');
            renderTheology();
            refreshReftagger();
          });
        });

        var filtered = appState.activeTheologyTab === 'all'
          ? THEOLOGY_CATEGORIES
          : THEOLOGY_CATEGORIES.filter(function (c) { return c.id === appState.activeTheologyTab; });

        gridEl.innerHTML = filtered.map(function (cat) {
          var itemsHtml = cat.items.map(function (item, idx) {
            var refsHtml = item.refs.map(buildScriptureHTML).join(lang === 'zh' ? '，' : ', ');
            return (
              '<li class="py-2.5 flex items-baseline justify-between gap-3 border-b border-parchmentBorder/60 last:border-b-0">' +
                '<div class="flex items-baseline gap-2.5 text-xs sm:text-sm text-ink">' +
                  '<span class="text-[11px] font-bold text-gold shrink-0">' + (idx + 1) + '.</span>' +
                  '<span>' + item[lang] + '</span>' +
                '</div>' +
                '<div class="text-xs shrink-0">' + refsHtml + '</div>' +
              '</li>'
            );
          }).join('');

          return (
            '<div class="bg-white rounded-2xl border border-parchmentBorder shadow-card overflow-hidden">' +
              '<div class="px-5 py-3.5 bg-parchmentDeep/75 border-b border-parchmentBorder flex items-center justify-between">' +
                '<h3 class="font-serif text-lg font-bold text-navy">' + cat.title[lang] + '</h3>' +
                '<span class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-white border border-parchmentBorder text-gold">' + cat.items.length + '</span>' +
              '</div>' +
              '<ul class="px-5 py-2">' + itemsHtml + '</ul>' +
            '</div>'
          );
        }).join('');
      }

      function renderPastoralApplication() {
        var lang = appState.lang;
        var grid = document.getElementById('pastoralApplicationGrid');
        if (!grid) return;

        grid.innerHTML = PASTORAL_APPLICATIONS.map(function (card) {
          var listHtml = card.points.map(function (pt, idx) {
            var refsHtml = pt.refs.map(buildScriptureHTML).join(lang === 'zh' ? '，' : ', ');
            return (
              '<li class="p-3.5 rounded-xl bg-parchment/75 border border-parchmentBorder/80 flex flex-col sm:flex-row sm:items-baseline justify-between gap-2">' +
                '<div class="flex items-baseline gap-2.5 text-xs sm:text-sm text-ink font-medium">' +
                  '<span class="w-5 h-5 rounded-full bg-navy text-white text-[11px] font-bold inline-flex items-center justify-center shrink-0">' + (idx + 1) + '</span>' +
                  '<span>' + pt[lang] + '</span>' +
                '</div>' +
                '<div class="text-xs sm:text-right pl-7 sm:pl-0 shrink-0">' + refsHtml + '</div>' +
              '</li>'
            );
          }).join('');

          return (
            '<div class="bg-white rounded-2xl border border-parchmentBorder shadow-card overflow-hidden flex flex-col">' +
              '<div class="px-6 py-5 bg-parchmentDeep/75 border-b border-parchmentBorder">' +
                '<span class="inline-block text-[11px] font-bold tracking-[0.16em] text-gold mb-1">' + card.badge[lang] + '</span>' +
                '<h3 class="font-serif text-xl sm:text-2xl font-bold text-navy">' + card.title[lang] + '</h3>' +
                '<p class="text-xs text-inkMuted mt-1">' + card.subtitle[lang] + '</p>' +
              '</div>' +
              '<ul class="p-5 space-y-2.5 flex-1">' + listHtml + '</ul>' +
            '</div>'
          );
        }).join('');
      }

      function renderFooterSitemap() {
        var lang = appState.lang;
        var dict = UI_TEXT[lang];
        var container = document.getElementById('footerSitemap');
        if (!container) return;

        var homeItem =
          '<a href="index.html" class="flex items-center gap-2 px-3 py-2 rounded-lg bg-white/10 border border-gold/40 text-white font-semibold">' +
            '<span class="px-1.5 py-0.5 rounded bg-gold text-white text-[10px]">' + dict.sitemapHomeTag + '</span>' +
            '<span class="truncate">' + dict.sitemapHomeLabel + '</span>' +
          '</a>';

        var unitItems = UNITS.map(function (u) {
          return (
            '<a href="' + u.href + '" class="flex items-center gap-2 px-3 py-2 rounded-lg bg-white/5 hover:bg-white/10 border border-white/10 text-slate-300 hover:text-white transition-colors">' +
              '<span class="px-1.5 py-0.5 rounded bg-white/10 text-goldLight text-[10px] font-bold shrink-0">' + u.marker[lang] + '</span>' +
              '<span class="truncate">' + formatDisplayRef(u.ref, lang) + ' · ' + u.title[lang] + '</span>' +
            '</a>'
          );
        }).join('');

        container.innerHTML = homeItem + unitItems;
      }

      function renderAll() {
        hideZhTip();
        renderStaticChrome();
        renderChiasm();
        renderUnits();
        renderTheology();
        renderPastoralApplication();
        renderFooterSitemap();
        refreshReftagger();
      }

      // -------------------------------------------------------------------
      // 10. EVENT LISTENERS
      // -------------------------------------------------------------------
      function initEvents() {
        // Language toggle
        var langToggleBtn = document.getElementById('btn-lang-toggle');
        if (langToggleBtn) {
          langToggleBtn.addEventListener('click', function () {
            appState.lang = appState.lang === 'zh' ? 'en' : 'zh';
            saveLanguage(appState.lang);
            renderAll();
          });
        }

        // Mobile drawer toggle
        var mobileBtn = document.getElementById('mobileMenuBtn');
        var mobileMenu = document.getElementById('mobileMenu');
        if (mobileBtn && mobileMenu) {
          mobileBtn.addEventListener('click', function () {
            var isOpen = !mobileMenu.classList.contains('hidden');
            mobileMenu.classList.toggle('hidden', isOpen);
            mobileBtn.setAttribute('aria-expanded', String(!isOpen));
          });
          mobileMenu.querySelectorAll('.mobile-nav-link').forEach(function (link) {
            link.addEventListener('click', function () {
              mobileMenu.classList.add('hidden');
              mobileBtn.setAttribute('aria-expanded', 'false');
            });
          });
        }

        // Password access gate submission & visibility toggle
        var gateForm = document.getElementById('accessGateForm');
        var pwdInput = document.getElementById('accessPasswordInput');
        var errMsg = document.getElementById('accessErrorMsg');
        var togglePwdBtn = document.getElementById('togglePasswordVisibility');
        var eyeShow = document.getElementById('eyeIconShow');
        var eyeHide = document.getElementById('eyeIconHide');

        if (togglePwdBtn && pwdInput) {
          togglePwdBtn.addEventListener('click', function () {
            var isHidden = pwdInput.type === 'password';
            pwdInput.type = isHidden ? 'text' : 'password';
            if (eyeShow && eyeHide) {
              eyeShow.classList.toggle('hidden', isHidden);
              eyeHide.classList.toggle('hidden', !isHidden);
            }
            var dict = UI_TEXT[appState.lang];
            togglePwdBtn.setAttribute('aria-label', isHidden ? dict.gateHidePwd : dict.gateShowPwd);
          });
        }

        if (pwdInput && errMsg) {
          pwdInput.addEventListener('input', function () {
            errMsg.classList.add('hidden');
            pwdInput.classList.remove('border-red-500', 'ring-1', 'ring-red-500');
          });
        }

        if (gateForm && pwdInput) {
          gateForm.addEventListener('submit', function (e) {
            e.preventDefault();
            var entered = String(pwdInput.value || '').trim();
            if (entered === ACCESS_PASSWORD) {
              appState.isUnlocked = true;
              saveUnlockState();
              if (errMsg) errMsg.classList.add('hidden');
              pwdInput.value = '';
              applyAccessLockState();
              refreshReftagger();
            } else {
              if (errMsg) errMsg.classList.remove('hidden');
              pwdInput.classList.add('border-red-500', 'ring-1', 'ring-red-500');
              pwdInput.focus();
              pwdInput.select();
            }
          });
        }

        // While locked, clicking section anchor links smoothly directs focus to the password gate
        document.querySelectorAll('a[href="#chiasm"], a[href="#units"], a[href="#theology"], a[href="#application"]').forEach(function (anchor) {
          anchor.addEventListener('click', function (e) {
            if (!appState.isUnlocked) {
              e.preventDefault();
              var gateEl = document.getElementById('accessGate');
              if (gateEl) gateEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
              if (pwdInput) window.setTimeout(function () { pwdInput.focus(); }, 250);
            }
          });
        });

        // Delegated hover & tap events for Chinese Union Version (和合本) citations
        if (!isTouchDevice) {
          document.addEventListener('mouseover', function (e) {
            var a = e.target.closest && e.target.closest('a.sc-zh');
            if (a && a !== tipTarget) {
              showZhTip(a);
            } else if (a || (e.target.closest && e.target.closest('#zh-tip'))) {
              clearTimeout(hideTipTimer);
            }
          });
          document.addEventListener('mouseout', function (e) {
            var a = e.target.closest && (e.target.closest('a.sc-zh') || e.target.closest('#zh-tip'));
            if (a) {
              clearTimeout(hideTipTimer);
              hideTipTimer = window.setTimeout(hideZhTip, 220);
            }
          });
          document.addEventListener('scroll', function (e) {
            if (!tipEl.contains(e.target)) hideZhTip();
          }, true);
        } else {
          document.addEventListener('click', function (e) {
            var a = e.target.closest && e.target.closest('a.sc-zh');
            if (a) {
              if (tipTarget === a && tipEl.classList.contains('visible')) return;
              e.preventDefault();
              e.stopPropagation();
              showZhTip(a);
              return;
            }
            if (!tipEl.contains(e.target)) hideZhTip();
          }, true);
        }
      }

      // -------------------------------------------------------------------
      // 11. BOOTSTRAP
      // -------------------------------------------------------------------
      function bootstrapApp() {
        try {
          loadSavedLanguage();
          loadUnlockState();
          initEvents();
          applyAccessLockState();
          renderAll();
        } catch (err) {
          console.error('Failed to initialize Book of James course homepage:', err);
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', bootstrapApp);
      } else {
        bootstrapApp();
      }
    })();
  </script>
</body>
</html>
